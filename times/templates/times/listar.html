{% load static %}
<link rel="stylesheet" href="{% static 'times/style.css' %}">

<h2>Meu Catálogo de Times</h2>
<a href="{% url 'logout' %}">Sair</a> | <a href="{% url 'adicionar' %}">Adicionar Time</a>
<ul>
    {% for time in times %}
        <li>
            {{ time.nome }} — Nota: {{ time.nota|default:"sem nota" }}
            <br>
            {{ time.descricao }}
            <br>
            <a href="{% url 'editar' time.pk %}">Editar</a>
            <a href="{% url 'excluir' time.pk %}">Excluir</a>
        </li>
    {% empty %}
        <li>Nenhum time cadastrado ainda.</li>
    {% endfor %}
</ul>
